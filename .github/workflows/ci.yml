name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, copilot/**]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend Tests ─────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: projectface_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: projectface_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://projectface_test:test_password@localhost:5432/projectface_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          OPENAI_API_KEY: sk-test-key
          OPENWEATHER_API_KEY: test-weather-key
          STRIPE_SECRET_KEY: sk_test_key
        run: |
          python -m pytest app/tests/ -v --cov=app --cov-report=term-missing
      
      - name: Check code style
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check app/
  
  # ─── Frontend Tests ────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      
      - name: Run linter
        working-directory: ./frontend
        run: pnpm lint
      
      - name: Run tests
        working-directory: ./frontend
        run: pnpm test
      
      - name: Build
        working-directory: ./frontend
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
  
  # ─── Security Scan ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
  
  # ─── Docker Build Test ─────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: projectface-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: projectface-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  # ─── Integration Test ──────────────────────────────────────
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file
        run: cp .env.example .env
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d --wait --wait-timeout 120
      
      - name: Check backend health
        run: |
          sleep 10
          curl -f http://localhost:8000/health || exit 1
      
      - name: Check frontend
        run: |
          curl -f http://localhost/ || exit 1
      
      - name: Run integration tests
        run: |
          # Add integration test script here if needed
          echo "Integration tests placeholder"
      
      - name: Stop services
        if: always()
        run: docker compose down -v
      
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
