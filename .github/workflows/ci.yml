name: Project Face CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ─── Backend Tests ───────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: projectface_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check app/ --ignore E501

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/projectface_test
          SECRET_KEY: test-secret-key-for-ci
          OPENAI_API_KEY: test-key
          OPENWEATHERMAP_API_KEY: test-key
          STRIPE_SECRET_KEY: test-key
          STRIPE_WEBHOOK_SECRET: test-key
        run: |
          python -m pytest app/tests/ -v --tb=short

  # ─── Frontend Build ──────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Type check
        working-directory: ./frontend
        run: pnpm tsc --noEmit || true

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_URL: ""
        run: pnpm build

  # ─── Docker Build ────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t projectface-backend ./backend

      - name: Build frontend image
        run: docker build -t projectface-frontend ./frontend

  # ─── Security Scan ───────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run safety check
        working-directory: ./backend
        run: |
          pip install safety
          safety check -r requirements.txt --output text || true

      - name: Run bandit
        working-directory: ./backend
        run: |
          pip install bandit
          bandit -r app/ -ll --skip B101 || true
