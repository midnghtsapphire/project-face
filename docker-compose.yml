version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: projectface-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectface_secret}
      POSTGRES_DB: ${POSTGRES_DB:-projectface}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectface}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projectface-net

  # ─── Redis Cache ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: projectface-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-projectface_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-projectface_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projectface-net

  # ─── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectface-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-projectface}:${POSTGRES_PASSWORD:-projectface_secret}@postgres:5432/${POSTGRES_DB:-projectface}
      REDIS_URL: redis://:${REDIS_PASSWORD:-projectface_redis}@redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - projectface-net

  # ─── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    container_name: projectface-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - projectface-net

  # ─── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: projectface-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - projectface-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  projectface-net:
    driver: bridge
